databaseChangeLog:
  - changeSet:
      id: 2026-07-12-001-create-stock-reservations
      author: tuiop
      labels: catalog-service
      changes:
        - createTable:
            tableName: stock_reservations
            columns:
              - column:
                  name: id
                  type: uuid
                  constraints:
                    nullable: false
                    primaryKey: true
                    primaryKeyName: pk_stock_reservations
              - column:
                  name: status
                  type: varchar(30)
                  defaultValue: RESERVED
                  constraints:
                    nullable: false
              - column:
                  name: created_at
                  type: timestamp with time zone
                  defaultValueComputed: CURRENT_TIMESTAMP
                  constraints:
                    nullable: false
              - column:
                  name: updated_at
                  type: timestamp with time zone
                  defaultValueComputed: CURRENT_TIMESTAMP
                  constraints:
                    nullable: false
              - column:
                  name: version
                  type: bigint
                  defaultValueNumeric: 0
                  constraints:
                    nullable: false
        - sql:
            sql: >-
              ALTER TABLE stock_reservations
              ADD CONSTRAINT chk_stock_reservations_status
              CHECK (status IN ('RESERVED', 'RELEASED', 'COMMITTED'))
            rollback: ALTER TABLE stock_reservations DROP CONSTRAINT chk_stock_reservations_status
        - createTable:
            tableName: stock_reservation_items
            columns:
              - column:
                  name: id
                  type: uuid
                  constraints:
                    nullable: false
                    primaryKey: true
                    primaryKeyName: pk_stock_reservation_items
              - column:
                  name: product_id
                  type: uuid
                  constraints:
                    nullable: false
              - column:
                  name: merchant_id
                  type: uuid
                  constraints:
                    nullable: false
              - column:
                  name: reservation_id
                  type: uuid
                  constraints:
                    nullable: false
              - column:
                  name: product_name
                  type: varchar(255)
                  constraints:
                    nullable: false
              - column:
                  name: unit_price_cents
                  type: bigint
                  constraints:
                    nullable: false
              - column:
                  name: quantity
                  type: integer
                  constraints:
                    nullable: false
        - addForeignKeyConstraint:
            baseTableName: stock_reservation_items
            baseColumnNames: reservation_id
            referencedTableName: stock_reservations
            referencedColumnNames: id
            constraintName: fk_stock_reservation_items_reservation
            onDelete: CASCADE
        - createIndex:
            tableName: stock_reservation_items
            indexName: idx_stock_reservation_items_reservation_id
            columns:
              - column:
                  name: reservation_id
        - createIndex:
            tableName: stock_reservation_items
            indexName: idx_stock_reservation_items_product_id
            columns:
              - column:
                  name: product_id
        - sql:
            sql: >-
              ALTER TABLE stock_reservation_items
              ADD CONSTRAINT chk_stock_reservation_items_quantity_positive
              CHECK (quantity > 0)
            rollback: ALTER TABLE stock_reservation_items DROP CONSTRAINT chk_stock_reservation_items_quantity_positive
      rollback:
        - dropTable:
            tableName: stock_reservation_items
        - dropTable:
            tableName: stock_reservations
