spring:
  application:
    name: catalog-service

  http:
    clients:
      connect-timeout: 2s
      read-timeout: 5s



  datasource:
    username: markethub
    password: markethub
    url: jdbc:postgresql://localhost:5432/catalog

  jpa:
    hibernate:
      ddl-auto: validate
    open-in-view: false

  liquibase:
    change-log: classpath:/db/changelog/db.changelog-master.yaml

  security:
    oauth2:
      resourceserver:
        jwt:
          issuer-uri: ${KEYCLOAK_ISSUER_URI:http://localhost:8080/realms/markethub}

services:
  account:
    url: ${ACCOUNT_SERVICE_URL:http://account-service}
server:
  port: 8082

eureka:
  client:
    service-url:
      defaultZone: ${EUREKA_URL:http://localhost:8761/eureka/}
