spring:
  application:
    name: cart-service

  security:
    oauth2:
      resourceserver:
        jwt:
          issuer-uri: ${KEYCLOAK_ISSUER_URI:http://localhost:8080/realms/markethub}

  datasource:
    username: markethub
    password: markethub
    url: jdbc:postgresql://localhost:5432/cart

  jpa:
    hibernate:
      ddl-auto: validate
    open-in-view: false

  liquibase:
    change-log: classpath:/db/changelog/db.changelog-master.yaml

server:
  port: 8084

services:
  account:
    url: ${ACCOUNT_SERVICE_URL:http://localhost:8081}
  catalog:
    url: ${CATALOG_SERVICE_URL:http://localhost:8082}
  order:
    url: ${ORDER_SERVICE_URL:http://localhost:8083}
