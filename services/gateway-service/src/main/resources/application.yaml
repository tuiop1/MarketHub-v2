spring:
  application:
    name: gateway-service

  data:
    redis:
      host: ${SPRING_REDIS_HOST:localhost}
      port: ${SPRING_REDIS_PORT:6379}

  security:
    oauth2:
      resourceserver:
        jwt:
          issuer-uri: ${KEYCLOAK_ISSUER_URI:http://localhost:8090/realms/markethub}
  cloud:
    gateway:
      server:
        webflux:
          routes:
            - id: account-service
              uri: ${ACCOUNT_SERVICE_URL:lb://account-service}
              predicates:
                - Path=/api/v1/merchants,/api/v1/merchants/**,/api/v1/customers,/api/v1/customers/**,/api/v1/auth/**,/api/v1/admin/merchants,/api/v1/admin/merchants/**,/api/v1/admin/customers,/api/v1/admin/customers/**

            - id: catalog-service
              uri: ${CATALOG_SERVICE_URL:lb://catalog-service}
              predicates:
                - Path=/api/v1/products,/api/v1/products/**,/api/v1/categories,/api/v1/categories/**,/api/v1/merchant/products,/api/v1/merchant/products/**,/api/v1/admin/categories,/api/v1/admin/categories/**

            - id: order-service
              uri: ${ORDER_SERVICE_URL:lb://order-service}
              predicates:
                - Path=/api/v1/orders,/api/v1/orders/**

            - id: cart-service
              uri: ${CART_SERVICE_URL:lb://cart-service}
              predicates:
                - Path=/api/v1/carts,/api/v1/carts/**

            - id: payment-service
              uri: ${PAYMENT_SERVICE_URL:lb://payment-service}
              predicates:
                - Path=/api/v1/payments,/api/v1/payments/**





server:
  port: 8080




management:
  endpoints:
    web:
      exposure:
        include: health,info,prometheus
  metrics:
    tags:
      application: ${spring.application.name}

eureka:
  instance:
    prefer-ip-address: true
  client:
    service-url:
      defaultZone: ${EUREKA_URL:http://localhost:8761/eureka/}

logging:
  structured:
    format:
      console: ecs
    ecs:
      service:
        environment: ${APP_ENVIRONMENT:local}



app:
  rate-limit:
    enabled: true
    request-limit: ${REQUEST_LIMIT:50}
    window-size: ${WINDOW_SIZE:1m}
