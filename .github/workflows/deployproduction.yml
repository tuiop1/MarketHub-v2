name: Deploy to VPS

on:
  workflow_dispatch:

concurrency:
  group: production-vps
  cancel-in-progress: false

jobs:



  deploy:

    runs-on: ubuntu-latest

    steps:
      - name: Configure SSH
        env:
          SSH_PRIVATE_KEY: ${{ secrets.VPS_SSH_PRIVATE_KEY }}
        run: |
          set -euo pipefail
          
          test -n "$SSH_PRIVATE_KEY" || {
            echo "VPS_SSH_PRIVATE_KEY is empty"
            exit 1
          }
          
          install -d -m 700 ~/.ssh
          
          printf '%s\n' "$SSH_PRIVATE_KEY" |
            tr -d '\r' > ~/.ssh/id_ed25519
          
          chmod 600 ~/.ssh/id_ed25519
          
          # Verifies that the runner can parse the private key.
          ssh-keygen -y -f ~/.ssh/id_ed25519 > /dev/null

      - name: Deploy
        env:
          VPS_HOST: ${{ secrets.VPS_HOST }}
          VPS_USER: ${{ secrets.VPS_USER }}
        run: |
          ssh -i ~/.ssh/id_ed25519 "$VPS_USER@$VPS_HOST" << 'EOF'
            set -e

            cd /opt/MarketHub-v2

            compose() {
              docker compose \
                -f docker-compose.prod.yml \
                --env-file .env.prod \
                "$@"
            }

            # Remember whether observability is currently running.
            if compose --profile observability ps \
                --status running \
                --services | grep -qx "grafana"; then
              OBSERVABILITY_ENABLED=true
            else
              OBSERVABILITY_ENABLED=false
            fi

            git fetch origin main
            git reset --hard origin/main

            ./backend/mvnw \
              --batch-mode \
              --no-transfer-progress \
              -f backend/pom.xml \
              package \
              -DskipTests

            if [ "$OBSERVABILITY_ENABLED" = true ]; then
              compose --profile observability up -d --build
            else
              compose up -d --build
            fi
          EOF
