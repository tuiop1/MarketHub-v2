name: Test and build

on:
  push:
    branches: [dev]
  pull_request:
    branches: [main, dev]
  workflow_call:
    inputs:
      skip_image_builds:
        type: boolean
        default: false
      upload_frontend:
        type: boolean
        default: false

  workflow_dispatch:
    

permissions:
  contents: read

jobs:
  frontend-check:
    name: Test and build Angular
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v7.0.1
      - uses: actions/setup-node@v6
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - working-directory: frontend
        run: |
          npm ci
          npm test
          npm run build

      - name: Save tested frontend
        if: inputs.upload_frontend
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: frontend-${{ github.sha }}
          path: frontend/dist/markethub/browser/
          if-no-files-found: error
          retention-days: 3

  test:
    name: Run backend tests
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - name: Checkout repository
        uses: actions/checkout@v7.0.1

      - name: Set up Java 25
        uses: actions/setup-java@v5.7.0
        with:
          distribution: temurin
          java-version: "25"
          cache: maven
          cache-dependency-path: |
            backend/pom.xml
            backend/**/pom.xml

      - name: Run backend tests
        working-directory: backend
        run: ./mvnw --batch-mode --no-transfer-progress test

  build-images:
    name: Validate Compose and build images
    needs: test
    runs-on: ubuntu-latest
    timeout-minutes: 60

    # Compose evaluates required production variables before it builds any
    # image. These placeholders are not used to start services in CI.
    env:
      POSTGRES_PASSWORD: value
      KEYCLOAK_DB_PASSWORD: value
      KEYCLOAK_ADMIN_PASSWORD: value
      KEYCLOAK_ADMIN_CLIENT_SECRET: value
      SERVER_IP: value
      ACME_EMAIL: value

    steps:
      - name: Checkout repository
        uses: actions/checkout@v7.0.1

      - name: Validate local and production Compose configurations
        run: |
          docker compose --env-file .env.prod.example -f docker-compose.yml config --quiet
          EC2_ENV_FILE="$PWD/.env.prod.example" bash production/ec2/compose.sh --profile observability config --quiet
          AWS_ENV_FILE="$PWD/production/aws/.env.example" bash production/aws/compose.sh --profile observability config --quiet

      - name: Check deployment scripts
        run: |
          bash -n production/aws/compose.sh production/aws/deploy.sh
          python3 -c "import ast, pathlib; ast.parse(pathlib.Path('production/aws/deploy-via-ssm.py').read_text())"

      - name: Build production images
        if: ${{ !inputs.skip_image_builds }}
        run: |
          EC2_ENV_FILE="$PWD/.env.prod.example" \
            bash production/ec2/compose.sh --parallel 2 build
