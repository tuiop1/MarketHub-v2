name: Test and build

on:
  push:
    branches: [main, dev]
  pull_request:
    branches: [main, dev]
  workflow_call:

  workflow_dispatch:
    

permissions:
  contents: read

jobs:
  frontend-check:
    name: Test and build Angular
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v7.0.1
      - uses: actions/setup-node@v6
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - working-directory: frontend
        run: |
          npm ci
          npm test
          npm run build

  test:
    name: Run backend tests
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - name: Checkout repository
        uses: actions/checkout@v7.0.1

      - name: Set up Java 25
        uses: actions/setup-java@v5.7.0
        with:
          distribution: temurin
          java-version: "25"
          cache: maven
          cache-dependency-path: |
            backend/pom.xml
            backend/**/pom.xml

      - name: Run backend tests
        working-directory: backend
        run: ./mvnw --batch-mode --no-transfer-progress test

  build-images:
    name: Validate Compose and build images
    needs: test
    runs-on: ubuntu-latest
    timeout-minutes: 60

    # Compose evaluates required production variables before it builds any
    # image. These placeholders are not used to start services in CI.
    env:
      POSTGRES_PASSWORD: value
      KEYCLOAK_DB_PASSWORD: value
      KEYCLOAK_ADMIN_PASSWORD: value
      KEYCLOAK_ADMIN_CLIENT_SECRET: value
      SERVER_IP: value
      ACME_EMAIL: value

    steps:
      - name: Checkout repository
        uses: actions/checkout@v7.0.1

      - name: Validate local and production Compose configurations
        run: |
          docker compose --env-file .env.prod.example -f docker-compose.yml config --quiet
          EC2_ENV_FILE="$PWD/.env.prod.example" bash production/ec2/compose.sh --profile observability config --quiet
          AWS_ENV_FILE="$PWD/production/aws/.env.example" bash production/aws/compose.sh --profile observability config --quiet

      - name: Build production images
        run: |
          EC2_ENV_FILE="$PWD/.env.prod.example" \
            bash production/ec2/compose.sh --parallel 2 build
