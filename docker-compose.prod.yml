name: markethub-v2-prod

services:
  postgres:
    image: postgres:16.14-alpine3.24
    environment:
      POSTGRES_DB: markethub
      POSTGRES_USER: markethub
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?POSTGRES_PASSWORD is required}
      ACCOUNT_DB: account
      ACCOUNT_DB_USER: markethub
      ACCOUNT_DB_PASSWORD: ${POSTGRES_PASSWORD:?POSTGRES_PASSWORD is required}
      CATALOG_DB: catalog
      CATALOG_DB_USER: markethub
      CATALOG_DB_PASSWORD: ${POSTGRES_PASSWORD:?POSTGRES_PASSWORD is required}
      CART_DB: cart
      CART_DB_USER: markethub
      CART_DB_PASSWORD: ${POSTGRES_PASSWORD:?POSTGRES_PASSWORD is required}
      ORDER_DB: orders
      ORDER_DB_USER: markethub
      ORDER_DB_PASSWORD: ${POSTGRES_PASSWORD:?POSTGRES_PASSWORD is required}
      PAYMENT_DB: payment
      PAYMENT_DB_USER: markethub
      PAYMENT_DB_PASSWORD: ${POSTGRES_PASSWORD:?POSTGRES_PASSWORD is required}
      KEYCLOAK_DB: keycloak
      KEYCLOAK_DB_USER: keycloak
      KEYCLOAK_DB_PASSWORD: ${KEYCLOAK_DB_PASSWORD:?KEYCLOAK_DB_PASSWORD is required}
    volumes:
      - postgres-data:/var/lib/postgresql/data
      - ./docker/postgres/init-keycloak-db.sh:/docker-entrypoint-initdb.d/10-init-keycloak-db.sh:ro
    healthcheck:
      test: [ "CMD-SHELL", "pg_isready -U markethub -d markethub" ]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 10s
    restart: unless-stopped

  keycloak:
    image: quay.io/keycloak/keycloak:26.6.4
    command: start --import-realm

    environment:
      KC_DB: postgres
      KC_DB_URL: jdbc:postgresql://postgres:5432/keycloak
      KC_DB_USERNAME: keycloak
      KC_DB_PASSWORD: ${KEYCLOAK_DB_PASSWORD:?KEYCLOAK_DB_PASSWORD is required}

      KC_BOOTSTRAP_ADMIN_USERNAME: admin
      KC_BOOTSTRAP_ADMIN_PASSWORD: ${KEYCLOAK_ADMIN_PASSWORD:?KEYCLOAK_ADMIN_PASSWORD is required}
      KEYCLOAK_ADMIN_CLIENT_SECRET: "${KEYCLOAK_ADMIN_CLIENT_SECRET:?KEYCLOAK_ADMIN_CLIENT_SECRET must be set}"

      PUBLIC_APP_URL: https://${SERVER_IP:?SERVER_IP is required}
      KC_HOSTNAME: https://${SERVER_IP:?SERVER_IP is required}/auth
      KC_PROXY_HEADERS: xforwarded
      KC_HTTP_ENABLED: "true"
      KC_HOSTNAME_STRICT: "true"

      KC_HEALTH_ENABLED: "true"
      KC_METRICS_ENABLED: "true"

    expose:
      - "8080"

    volumes:
      - ./docker/keycloak/import:/opt/keycloak/data/import:ro
      - ./docker/keycloak/themes:/opt/keycloak/themes:ro

    depends_on:
      postgres:
        condition: service_healthy

    healthcheck:
      test: [ "CMD-SHELL", "timeout 5 bash -c '</dev/tcp/127.0.0.1/9000'" ]
      interval: 10s
      timeout: 5s
      retries: 12
      start_period: 30s

    restart: unless-stopped

  kafka:
    image: apache/kafka:4.1.1
    environment:
      KAFKA_NODE_ID: 1
      KAFKA_PROCESS_ROLES: broker,controller
      KAFKA_CONTROLLER_QUORUM_VOTERS: 1@kafka:29093
      KAFKA_LISTENERS: PLAINTEXT://:29092,CONTROLLER://:29093
      KAFKA_ADVERTISED_LISTENERS: PLAINTEXT://kafka:29092
      KAFKA_LISTENER_SECURITY_PROTOCOL_MAP: CONTROLLER:PLAINTEXT,PLAINTEXT:PLAINTEXT
      KAFKA_INTER_BROKER_LISTENER_NAME: PLAINTEXT
      KAFKA_CONTROLLER_LISTENER_NAMES: CONTROLLER
      KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR: 1
      KAFKA_TRANSACTION_STATE_LOG_REPLICATION_FACTOR: 1
      KAFKA_TRANSACTION_STATE_LOG_MIN_ISR: 1
      KAFKA_GROUP_INITIAL_REBALANCE_DELAY_MS: 0
      KAFKA_AUTO_CREATE_TOPICS_ENABLE: "true"
    volumes:
      - kafka-data:/var/lib/kafka/data
    healthcheck:
      test: [ "CMD-SHELL", "/opt/kafka/bin/kafka-broker-api-versions.sh --bootstrap-server localhost:29092 >/dev/null 2>&1" ]
      interval: 10s
      timeout: 5s
      retries: 12
      start_period: 30s
    restart: unless-stopped

  redis:
    image: redis:8-alpine
    command: redis-server --appendonly yes
    volumes:
      - redis-data:/data
    healthcheck:
      test: [ "CMD", "redis-cli", "ping" ]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 5s
    restart: unless-stopped

  discovery-service:
    image: markethub/discovery-service:local
    build:
      context: ./backend/services/discovery-service
      dockerfile: Dockerfile
    labels:
      logging: "alloy"
    environment:
      MANAGEMENT_OPENTELEMETRY_TRACING_EXPORT_OTLP_ENDPOINT: http://tempo:4318/v1/traces
      MANAGEMENT_TRACING_EXPORT_OTLP_ENABLED: ${OTLP_TRACING_ENABLED:-false}
      MANAGEMENT_TRACING_SAMPLING_PROBABILITY: "1.0"
    restart: unless-stopped

  account-service:
    image: markethub/account-service:local
    build:
      context: ./backend/services/account-service
      dockerfile: Dockerfile
    labels:
      logging: "alloy"
    environment:
      SPRING_DATASOURCE_URL: jdbc:postgresql://postgres:5432/account
      SPRING_DATASOURCE_PASSWORD: ${POSTGRES_PASSWORD:?POSTGRES_PASSWORD is required}
      KAFKA_BOOTSTRAP_SERVERS: kafka:29092
      KEYCLOAK_ISSUER_URI: https://${SERVER_IP:?SERVER_IP is required}/auth/realms/markethub
      SPRING_SECURITY_OAUTH2_RESOURCESERVER_JWT_JWK_SET_URI: http://keycloak:8080/realms/markethub/protocol/openid-connect/certs
      KEYCLOAK_SERVER_URL: http://keycloak:8080
      KEYCLOAK_ADMIN_CLIENT_SECRET: "${KEYCLOAK_ADMIN_CLIENT_SECRET:?KEYCLOAK_ADMIN_CLIENT_SECRET must be set}"
      EUREKA_URL: http://discovery-service:8761/eureka/
      MANAGEMENT_OPENTELEMETRY_TRACING_EXPORT_OTLP_ENDPOINT: http://tempo:4318/v1/traces
      MANAGEMENT_TRACING_EXPORT_OTLP_ENABLED: ${OTLP_TRACING_ENABLED:-false}
      MANAGEMENT_TRACING_SAMPLING_PROBABILITY: "1.0"
    depends_on:
      postgres:
        condition: service_healthy
      kafka:
        condition: service_healthy
      keycloak:
        condition: service_healthy
      discovery-service:
        condition: service_started
    restart: unless-stopped

  catalog-service:
    image: markethub/catalog-service:local
    build:
      context: ./backend/services/catalog-service
      dockerfile: Dockerfile
    labels:
      logging: "alloy"
    environment:
      SPRING_DATASOURCE_URL: jdbc:postgresql://postgres:5432/catalog
      SPRING_DATASOURCE_PASSWORD: ${POSTGRES_PASSWORD:?POSTGRES_PASSWORD is required}
      SPRING_REDIS_HOST: redis
      SPRING_REDIS_PORT: 6379
      KEYCLOAK_ISSUER_URI: https://${SERVER_IP:?SERVER_IP is required}/auth/realms/markethub
      SPRING_SECURITY_OAUTH2_RESOURCESERVER_JWT_JWK_SET_URI: http://keycloak:8080/realms/markethub/protocol/openid-connect/certs
      EUREKA_URL: http://discovery-service:8761/eureka/
      MANAGEMENT_OPENTELEMETRY_TRACING_EXPORT_OTLP_ENDPOINT: http://tempo:4318/v1/traces
      MANAGEMENT_TRACING_EXPORT_OTLP_ENABLED: ${OTLP_TRACING_ENABLED:-false}
      MANAGEMENT_TRACING_SAMPLING_PROBABILITY: "1.0"
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
      keycloak:
        condition: service_healthy
      discovery-service:
        condition: service_started
      account-service:
        condition: service_started
    restart: unless-stopped

  cart-service:
    image: markethub/cart-service:local
    build:
      context: ./backend/services/cart-service
      dockerfile: Dockerfile
    labels:
      logging: "alloy"
    environment:
      SPRING_DATASOURCE_URL: jdbc:postgresql://postgres:5432/cart
      SPRING_DATASOURCE_PASSWORD: ${POSTGRES_PASSWORD:?POSTGRES_PASSWORD is required}
      KEYCLOAK_ISSUER_URI: https://${SERVER_IP:?SERVER_IP is required}/auth/realms/markethub
      SPRING_SECURITY_OAUTH2_RESOURCESERVER_JWT_JWK_SET_URI: http://keycloak:8080/realms/markethub/protocol/openid-connect/certs
      EUREKA_URL: http://discovery-service:8761/eureka/
      MANAGEMENT_OPENTELEMETRY_TRACING_EXPORT_OTLP_ENDPOINT: http://tempo:4318/v1/traces
      MANAGEMENT_TRACING_EXPORT_OTLP_ENABLED: ${OTLP_TRACING_ENABLED:-false}
      MANAGEMENT_TRACING_SAMPLING_PROBABILITY: "1.0"
    depends_on:
      postgres:
        condition: service_healthy
      keycloak:
        condition: service_healthy
      discovery-service:
        condition: service_started
      account-service:
        condition: service_started
      catalog-service:
        condition: service_started
    restart: unless-stopped

  payment-service:
    image: markethub/payment-service:local
    build:
      context: ./backend/services/payment-service
      dockerfile: Dockerfile
    labels:
      logging: "alloy"
    environment:
      SPRING_DATASOURCE_URL: jdbc:postgresql://postgres:5432/payment
      SPRING_DATASOURCE_PASSWORD: ${POSTGRES_PASSWORD:?POSTGRES_PASSWORD is required}
      KEYCLOAK_ISSUER_URI: https://${SERVER_IP:?SERVER_IP is required}/auth/realms/markethub
      SPRING_SECURITY_OAUTH2_RESOURCESERVER_JWT_JWK_SET_URI: http://keycloak:8080/realms/markethub/protocol/openid-connect/certs
      EUREKA_URL: http://discovery-service:8761/eureka/
      MANAGEMENT_OPENTELEMETRY_TRACING_EXPORT_OTLP_ENDPOINT: http://tempo:4318/v1/traces
      MANAGEMENT_TRACING_EXPORT_OTLP_ENABLED: ${OTLP_TRACING_ENABLED:-false}
      MANAGEMENT_TRACING_SAMPLING_PROBABILITY: "1.0"
    depends_on:
      postgres:
        condition: service_healthy
      keycloak:
        condition: service_healthy
      discovery-service:
        condition: service_started
    restart: unless-stopped

  order-service:
    image: markethub/order-service:local
    build:
      context: ./backend/services/order-service
      dockerfile: Dockerfile
    labels:
      logging: "alloy"
    environment:
      SPRING_DATASOURCE_URL: jdbc:postgresql://postgres:5432/orders
      SPRING_DATASOURCE_PASSWORD: ${POSTGRES_PASSWORD:?POSTGRES_PASSWORD is required}
      KAFKA_BOOTSTRAP_SERVERS: kafka:29092
      KEYCLOAK_ISSUER_URI: https://${SERVER_IP:?SERVER_IP is required}/auth/realms/markethub
      SPRING_SECURITY_OAUTH2_RESOURCESERVER_JWT_JWK_SET_URI: http://keycloak:8080/realms/markethub/protocol/openid-connect/certs
      EUREKA_URL: http://discovery-service:8761/eureka/
      MANAGEMENT_OPENTELEMETRY_TRACING_EXPORT_OTLP_ENDPOINT: http://tempo:4318/v1/traces
      MANAGEMENT_TRACING_EXPORT_OTLP_ENABLED: ${OTLP_TRACING_ENABLED:-false}
      MANAGEMENT_TRACING_SAMPLING_PROBABILITY: "1.0"
    depends_on:
      postgres:
        condition: service_healthy
      kafka:
        condition: service_healthy
      keycloak:
        condition: service_healthy
      discovery-service:
        condition: service_started
      account-service:
        condition: service_started
      catalog-service:
        condition: service_started
      payment-service:
        condition: service_started
    restart: unless-stopped

  notification-service:
    image: markethub/notification-service:local
    build:
      context: ./backend/services/notification-service
      dockerfile: Dockerfile
    labels:
      logging: "alloy"
    environment:
      KAFKA_BOOTSTRAP_SERVERS: kafka:29092
      SENDGRID_API_KEY: ${SENDGRID_API_KEY:-disabled}
      SENDGRID_FROM_EMAIL: ${SENDGRID_FROM_EMAIL:-noreply@markethub.local}
      SENDGRID_FROM_NAME: ${SENDGRID_FROM_NAME:-MarketHub}
      MANAGEMENT_OPENTELEMETRY_TRACING_EXPORT_OTLP_ENDPOINT: http://tempo:4318/v1/traces
      MANAGEMENT_TRACING_EXPORT_OTLP_ENABLED: ${OTLP_TRACING_ENABLED:-false}
      MANAGEMENT_TRACING_SAMPLING_PROBABILITY: "1.0"
    depends_on:
      kafka:
        condition: service_healthy
    restart: unless-stopped

  gateway-service:
    image: markethub/gateway-service:local
    build:
      context: ./backend/services/gateway-service
      dockerfile: Dockerfile
    labels:
      logging: "alloy"
    environment:
      SPRING_REDIS_HOST: redis
      SPRING_REDIS_PORT: 6379
      REQUEST_LIMIT: 50
      WINDOW_SIZE: 1m
      KEYCLOAK_ISSUER_URI: https://${SERVER_IP:?SERVER_IP is required}/auth/realms/markethub
      SPRING_SECURITY_OAUTH2_RESOURCESERVER_JWT_JWK_SET_URI: http://keycloak:8080/realms/markethub/protocol/openid-connect/certs
      EUREKA_URL: http://discovery-service:8761/eureka/
      MANAGEMENT_OPENTELEMETRY_TRACING_EXPORT_OTLP_ENDPOINT: http://tempo:4318/v1/traces
      MANAGEMENT_TRACING_EXPORT_OTLP_ENABLED: ${OTLP_TRACING_ENABLED:-false}
      MANAGEMENT_TRACING_SAMPLING_PROBABILITY: "1.0"
    depends_on:
      redis:
        condition: service_healthy
      keycloak:
        condition: service_healthy
      discovery-service:
        condition: service_started
      account-service:
        condition: service_started
      catalog-service:
        condition: service_started
      cart-service:
        condition: service_started
      order-service:
        condition: service_started
      payment-service:
        condition: service_started
    restart: unless-stopped

  frontend:
    image: markethub/frontend:prod
    build:
      context: ./frontend
      dockerfile: Dockerfile
      target: production
      args:
        BUILD_CONFIGURATION: production
        PUBLIC_KEYCLOAK_URL: https://${SERVER_IP:?SERVER_IP is required}/auth
    environment:
      SERVER_IP: ${SERVER_IP:?SERVER_IP is required}
      ACME_EMAIL: ${ACME_EMAIL:?ACME_EMAIL is required}
    ports:
      - "80:80"
      - "443:443"
      - "443:443/udp"
    volumes:
      - caddy-data:/data
      - caddy-config:/config
    depends_on:
      gateway-service:
        condition: service_started
      keycloak:
        condition: service_healthy
    restart: unless-stopped



  prometheus:
    profiles: [ "observability" ]
    image: prom/prometheus:v3.7.3
    container_name: markethub-prometheus
    command:
      - --config.file=/etc/prometheus/prometheus.yml
      - --storage.tsdb.path=/prometheus
    volumes:
      - ./observability/prometheus/prometheus.yml:/etc/prometheus/prometheus.yml:ro
      - prometheus-data:/prometheus
    restart: unless-stopped

  loki:
    profiles: [ "observability" ]
    image: grafana/loki:3.7.4
    container_name: markethub-loki

    command:
      - -config.file=/etc/loki/loki-config.yaml

    volumes:
      - ./observability/loki/loki-config.yaml:/etc/loki/loki-config.yaml:ro
      - loki-data:/loki

    restart: unless-stopped

  alloy:
    profiles: [ "observability" ]
    image: grafana/alloy:v1.18.0
    container_name: markethub-alloy

    command:
      - run
      - --server.http.listen-addr=0.0.0.0:12345
      - --storage.path=/var/lib/alloy/data
      - /etc/alloy/config.alloy

    volumes:
      - ./observability/alloy/config.alloy:/etc/alloy/config.alloy:ro
      - /var/run/docker.sock:/var/run/docker.sock:ro
      - alloy-data:/var/lib/alloy/data

    depends_on:
      - loki

    restart: unless-stopped

  grafana:
    profiles: [ "observability" ]
    image: grafana/grafana:13.1.1
    container_name: markethub-grafana

    ports:
      - "127.0.0.1:3001:3000"

    environment:
      GF_SECURITY_ADMIN_USER: ${GRAFANA_ADMIN_USER:-admin}
      GF_SECURITY_ADMIN_PASSWORD: ${GRAFANA_ADMIN_PASSWORD:-admin}
      GF_USERS_ALLOW_SIGN_UP: "false"

    volumes:
      - grafana-data:/var/lib/grafana
      - ./observability/grafana/provisioning:/etc/grafana/provisioning:ro

    depends_on:
      - loki
      - prometheus
      - tempo

    restart: unless-stopped



  tempo:
    profiles: [ "observability" ]
    image: grafana/tempo:2.9.0
    container_name: markethub-tempo
    command:
      - -config.file=/etc/tempo/tempo.yaml
    volumes:
      - ./observability/tempo/tempo.yaml:/etc/tempo/tempo.yaml:ro
      - tempo-data:/var/tempo
    restart: unless-stopped



volumes:
  postgres-data:
    name: markethub-v2-prod_postgres-data
  kafka-data:
    name: markethub-v2-prod_kafka-data
  redis-data:
    name: markethub-v2-prod_redis-data
  loki-data:
    name: markethub-v2-prod_loki-data
  alloy-data:
    name: markethub-v2-prod_alloy-data
  grafana-data:
    name: markethub-v2-prod_grafana-data
  prometheus-data:
    name: markethub-v2-prod_prometheus-data
  tempo-data:
    name: markethub-v2-prod_tempo-data
  caddy-data:
    name: markethub-v2-prod_caddy-data
  caddy-config:
    name: markethub-v2-prod_caddy-config
